name: tests

on:
  push:
  pull_request:

jobs:
  voice-receptionist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-receptionist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  crm-api:
    runs-on: ubuntu-latest
    env:
      CRM_PORT: "8090"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r crm/requirements.txt
      - name: Point the CRM at a temporary database
        run: echo "CRM_DB_PATH=$RUNNER_TEMP/demo.db" >> "$GITHUB_ENV"
      - name: Seed a fresh demo database
        run: python -m crm.seed_demo
      - name: Start the CRM
        run: |
          python -m uvicorn crm.server:app --host 127.0.0.1 --port "$CRM_PORT" > "$RUNNER_TEMP/crm.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$CRM_PORT/api/dashboard" > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/crm.log"; exit 1
      - name: API check (every endpoint, including each review fix)
        run: python crm/tests/api_check.py
