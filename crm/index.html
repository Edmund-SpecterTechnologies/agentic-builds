<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Specter CRM</title>
<style>
  /* ── Ledger ────────────────────────────────────────────────────────────────
     The CRM as a spreadsheet you can trust. One ink, hairline grid, colour only
     where it carries meaning (stage colours, "going cold", overdue). Numbers are
     mono and right-aligned. No third-party scripts: plain JS against /api. */
  :root {
    --paper: #ffffff; --wash: #f7f7f5; --hover: #f2f2ef; --sel: #eef2ff;
    --rule: #e8e8e4; --rule-strong: #d6d6d0;
    --ink: #171716; --ink-2: #4a4a46; --ink-3: #6e6e68; --ink-4: #b4b4ae; /* ink-3 passes WCAG AA (4.5:1+) on every background; ink-4 is for decoration only */
    --focus: #1d4ed8; --cold: #c2410c; --ok: #15803d; --bad: #b91c1c;
    --sans: ui-sans-serif, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 13px/1.45 var(--sans); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  .mono { font-family: var(--mono); font-feature-settings: "tnum"; }
  .muted { color: var(--ink-3); }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

  /* Sidebar */
  aside { background: var(--wash); border-right: 1px solid var(--rule); display: flex; flex-direction: column; padding: 14px 10px; gap: 20px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px; }
  .brand-mark { width: 22px; height: 22px; border: 1.5px solid var(--ink); display: grid; grid-template: 1fr 1fr / 1fr 1fr; }
  .brand-mark i { border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
  .brand-mark i:nth-child(2n) { border-right: 0; } .brand-mark i:nth-child(n+3) { border-bottom: 0; }
  .brand b { font-weight: 600; letter-spacing: -0.01em; }
  .search-btn { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--rule-strong); background: var(--paper); border-radius: 6px; padding: 6px 9px; color: var(--ink-3); width: 100%; text-align: left; }
  .search-btn:hover { border-color: var(--ink-3); }
  .kbd { font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 5px; background: var(--wash); }
  .nav-label { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); padding: 0 8px 6px; display: flex; align-items: center; gap: 8px; }
  .nav-label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .nav a { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 8px; border-radius: 5px; color: var(--ink-2); cursor: pointer; }
  .nav a:hover { background: var(--hover); }
  .nav a.on { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-strong); font-weight: 500; }
  .nav a .n { font: 11px var(--mono); color: var(--ink-3); }
  .nav a .lbl { display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 8px; flex: 0 0 auto; }
  .nav .x { opacity: 0; color: var(--ink-3); font-size: 12px; padding: 0 2px; }
  .nav a:hover .x { opacity: 1; }
  .nav .x:hover { color: var(--bad); }
  .side-foot { margin-top: auto; padding: 8px; font: 11px var(--mono); color: var(--ink-3); }

  /* Main */
  main { display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; }
  .head { padding: 18px 24px 0; border-bottom: 1px solid var(--rule); }
  .crumb { font: 11px var(--mono); color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
  .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 4px; padding-bottom: 14px; }
  .head.tabbed .title-row { padding-bottom: 0; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
  .btn { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 6px 11px; background: var(--paper); font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #333; }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .tabs { display: flex; gap: 18px; margin-top: 12px; }
  .tab { padding: 8px 0 9px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tab.on { color: var(--ink); border-color: var(--ink); }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .toolbar .grow { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; }
  .seg button { padding: 4px 10px; font-size: 12px; color: var(--ink-3); }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button.on { background: var(--ink); color: #fff; }
  .filter { border: 1px solid var(--rule-strong); border-radius: 999px; padding: 4px 11px; width: 210px; outline: none; background: var(--paper); }
  .filter:focus, .pick:focus { border-color: var(--focus); }
  .pick { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 8px; background: var(--paper); outline: none; }
  .body { flex: 1; overflow: auto; }

  /* Grid */
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 980px; }
  .grid th, .grid td { border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 0 12px; height: 38px; text-align: left; white-space: nowrap; }
  .grid th { position: sticky; top: 0; background: var(--paper); z-index: 2; font: 500 11px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; height: 34px; user-select: none; }
  .grid th[data-sort] { cursor: pointer; }
  .grid th[data-sort]:hover { color: var(--ink); }
  .grid th .t { font: 10px var(--mono); color: var(--ink-4); margin-right: 6px; text-transform: none; letter-spacing: 0; }
  .grid .num { text-align: right; }
  .grid td:first-child, .grid th:first-child { position: sticky; left: 0; background: inherit; z-index: 1; width: 40px; min-width: 40px; max-width: 40px; text-align: center; padding: 0; }
  .grid th:first-child { z-index: 3; background: var(--paper); }
  .grid td:nth-child(2), .grid th:nth-child(2) { position: sticky; left: 40px; z-index: 1; background: inherit; box-shadow: 1px 0 0 var(--rule-strong); max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  .grid th:nth-child(2) { z-index: 3; background: var(--paper); }
  .grid tr.row { background: var(--paper); }
  .grid tr.row:hover { background: var(--wash); }
  .grid tr.row.sel { background: var(--sel); }
  .grid tr.group td { background: var(--wash); height: 32px; font-size: 12px; color: var(--ink-2); }
  .grid tr.group b { font-weight: 600; color: var(--ink); margin: 0 8px 0 6px; }
  .grid tfoot td { position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--rule-strong); height: 36px; font: 12px var(--mono); color: var(--ink-3); z-index: 2; }
  .grid tfoot b { color: var(--ink); font-weight: 500; }
  input[type=checkbox] { accent-color: var(--ink); width: 14px; height: 14px; cursor: pointer; }
  .cell-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cell-main > [contenteditable]:not(:focus), .cell-main > .person { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .cell-main > .open { flex: 0 0 auto; }
  [contenteditable] { outline: none; padding: 2px 4px; margin: -2px -4px; border-radius: 4px; min-width: 20px; display: inline-block; }
  [contenteditable]:hover { box-shadow: inset 0 0 0 1px var(--rule-strong); }
  [contenteditable]:focus { box-shadow: 0 0 0 2px var(--focus); background: #fff; }
  .open { opacity: 0; font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 6px; margin-left: auto; background: var(--paper); }
  tr.row:hover .open { opacity: 1; }
  .stage { display: inline-flex; align-items: center; gap: 7px; }
  .stage i { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  select.inline { border: 0; background: transparent; cursor: pointer; padding: 4px 0; appearance: none; outline: none; }
  select.inline:hover { text-decoration: underline dotted; }
  .person { display: inline-flex; align-items: center; gap: 7px; }
  .av { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: #fff; display: inline-grid; place-items: center; font: 600 9px var(--sans); flex: 0 0 auto; }
  .cold { color: var(--cold); font-weight: 500; }
  .late { color: var(--bad); font-weight: 500; }
  .none { color: var(--ink-3); font-style: italic; }
  .pill { font: 11px var(--mono); border: 1px solid var(--rule-strong); border-radius: 999px; padding: 1px 7px; color: var(--ink-2); background: var(--wash); }
  .pill.won { color: var(--ok); border-color: #bbe5c8; background: #f0fbf3; }
  .pill.lost { color: var(--bad); border-color: #f3c4c4; background: #fdf3f3; }
  .empty { padding: 48px 24px; color: var(--ink-3); }
  .bulk { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 10px 8px 16px; display: flex; gap: 10px; align-items: center; box-shadow: 0 12px 30px rgba(0,0,0,.25); z-index: 5; }
  .bulk select, .bulk button { background: #2b2b29; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 4px 8px; }

  /* Board */
  .board { display: flex; gap: 12px; padding: 16px 24px; align-items: flex-start; min-height: 100%; }
  .col { width: 250px; flex: 0 0 250px; border-radius: 8px; padding: 2px; }
  .col.over { background: var(--sel); }
  .col h3 { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; padding: 6px 4px 8px; border-bottom: 1px solid var(--rule); margin-bottom: 8px; }
  .col h3 span { margin-left: auto; font: 11px var(--mono); color: var(--ink-3); }
  .card { border: 1px solid var(--rule); border-radius: 6px; padding: 10px; margin-bottom: 8px; background: var(--paper); cursor: grab; }
  .card:hover { border-color: var(--rule-strong); }
  .card.dragging { opacity: .4; }
  .card .v { font: 12px var(--mono); margin-top: 6px; display: flex; justify-content: space-between; color: var(--ink-3); }
  .card .v b { color: var(--ink); font-weight: 500; }

  /* Peek panel */
  .peek { position: absolute; top: 0; right: 0; bottom: 0; width: 460px; background: var(--paper); border-left: 1px solid var(--rule-strong); transform: translateX(100%); visibility: hidden; transition: transform .28s cubic-bezier(.16,1,.3,1); display: flex; flex-direction: column; z-index: 10; }
  .peek.on { transform: none; visibility: visible; box-shadow: -24px 0 48px -24px rgba(0,0,0,.18); }
  .peek-head { padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  .peek-head .r1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .peek h2 { font-size: 19px; letter-spacing: -0.02em; margin-top: 6px; word-break: break-word; }
  .peek-body { overflow: auto; padding: 4px 20px 24px; flex: 1; }
  .fld { display: grid; grid-template-columns: 116px 1fr; border-bottom: 1px solid var(--rule); align-items: center; }
  .fld label { font: 11px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; padding: 10px 0; }
  .fld input, .fld select, .fld textarea { border: 0; outline: none; padding: 9px 6px; background: transparent; border-radius: 4px; width: 100%; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { box-shadow: inset 0 0 0 2px var(--focus); }
  .fld textarea { resize: vertical; min-height: 60px; }
  .fld input[type=color] { width: 36px; height: 26px; padding: 0; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin: 14px 0 4px; }
  .actions .grow { flex: 1; }
  .sec { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin: 24px 0 10px; display: flex; gap: 8px; align-items: center; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .rel { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .rel:hover { background: var(--wash); }
  .tl { position: relative; padding-left: 18px; }
  .tl::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--rule-strong); }
  .tl-item { position: relative; padding: 0 0 14px; }
  .tl-item::before { content: ""; position: absolute; left: -18px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--ink); }
  .tl-item .m { font: 11px var(--mono); color: var(--ink-3); display: flex; justify-content: space-between; }
  .tl-item .m button { color: var(--ink-3); } .tl-item .m button:hover { color: var(--bad); }
  .composer { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 8px; margin-top: 8px; }
  .composer:focus-within { border-color: var(--focus); }
  .composer textarea { width: 100%; border: 0; outline: none; resize: vertical; min-height: 44px; }
  .composer .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

  /* Reports + settings */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid var(--rule); }
  .kpi { padding: 18px 24px; border-right: 1px solid var(--rule); }
  .kpi:last-child { border-right: 0; }
  .kpi b { display: block; font: 500 24px var(--mono); letter-spacing: -0.02em; }
  .kpi span { font: 11px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { padding: 18px 24px 24px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .bars div { display: grid; grid-template-columns: 140px 1fr 70px; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .bars i { height: 8px; background: var(--ink); display: block; border-radius: 1px; min-width: 1px; }
  .bars b { font: 500 12px var(--mono); text-align: right; }
  .pipe { padding: 18px 24px; border-bottom: 1px solid var(--rule); }
  .pipe-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .pipe-head input { font-size: 17px; font-weight: 600; border: 0; outline: none; padding: 2px 4px; border-radius: 4px; }
  .pipe-head input:focus { box-shadow: 0 0 0 2px var(--focus); }
  .stage-row { display: grid; grid-template-columns: 40px 1fr 90px 120px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); max-width: 640px; }
  .stage-row input[type=text] { border: 0; outline: none; padding: 4px 6px; border-radius: 4px; }
  .stage-row input[type=text]:focus { box-shadow: 0 0 0 2px var(--focus); }
  .stage-row input[type=color] { width: 28px; height: 22px; border: 0; background: none; padding: 0; }

  /* Palette + toast */
  .veil { position: fixed; inset: 0; background: rgba(23,23,22,.28); display: none; z-index: 30; }
  .veil.on { display: block; }
  .pal { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); width: 560px; background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 10px; box-shadow: 0 30px 70px rgba(0,0,0,.2); z-index: 31; display: none; overflow: hidden; }
  .pal.on { display: block; }
  .pal input { width: 100%; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 16px; font-size: 15px; outline: none; }
  .pal-list { max-height: 360px; overflow: auto; padding: 6px; }
  .pal-sec { font: 500 10.5px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .12em; padding: 8px 10px 4px; }
  .pal-it { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .pal-it.on { background: var(--sel); }
  .pal-it .sub { margin-left: auto; color: var(--ink-3); font: 12px var(--mono); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 160%); opacity: 0; pointer-events: none; background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; transition: transform .25s cubic-bezier(.16,1,.3,1); z-index: 40; max-width: 70vw; }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }
  .toast.err { background: var(--bad); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><b>Specter CRM</b></div>
    <button class="search-btn" data-act="palette"><span>Search records…</span><span class="kbd">Ctrl K</span></button>
    <div><div class="nav-label">Records</div><nav class="nav" id="nav-records"></nav></div>
    <div><div class="nav-label">Views</div><nav class="nav" id="nav-views"></nav></div>
    <div><div class="nav-label">Workspace</div><nav class="nav" id="nav-work"></nav></div>
    <div class="side-foot">Local · single user</div>
  </aside>
  <main>
    <div id="head"></div>
    <div id="toolbar"></div>
    <div class="body" id="body"></div>
    <div id="bulk"></div>
    <section class="peek" id="peek">
      <div class="peek-head"><div class="r1"><span class="crumb" id="peek-kind"></span><button class="btn sm" data-act="close-peek">Close ⎋</button></div><h2 id="peek-title"></h2></div>
      <div class="peek-body" id="peek-body"></div>
    </section>
  </main>
</div>
<div class="veil" id="veil" data-act="close-pal"></div>
<div class="pal" id="pal"><input id="pal-q" placeholder="Search people, companies, and deals, or type a command…" autocomplete="off" /><div class="pal-list" id="pal-list"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ── Data layer ────────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => { const v = +n || 0; return '$' + v.toLocaleString('en-US', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('') || '?';
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const daysSince = iso => iso ? Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000)) : null;
const ago = d => d == null ? '—' : d === 0 ? 'Today' : d === 1 ? 'Yesterday' : d + 'd ago';
const fmtDate = iso => iso ? new Date(iso.length === 10 ? iso + 'T12:00:00' : iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: iso.slice(0, 4) === String(new Date().getFullYear()) ? undefined : 'numeric' }) : '';
const COLD_DAYS = 7;
const ROW_CAP = 500;
const LOAD_LIMIT = 5000;
const fullNote = key => S.full?.[key] ? `<span class="late" style="font-size:12px">Only the newest ${LOAD_LIMIT.toLocaleString('en-US')} are loaded; there may be more.</span>` : '';
const capped = rows => S.showAll ? rows : rows.slice(0, ROW_CAP);
const moreRow = (rows, span) => rows.length > ROW_CAP && !S.showAll ? `<tr class="group"><td></td><td colspan="${span}">Showing ${ROW_CAP} of ${rows.length.toLocaleString('en-US')}. <a data-act="show-all" style="cursor:pointer;text-decoration:underline">Show all</a></td></tr>` : '';
// Stage colours go into style attributes, so only a real hex colour is allowed through.
const color = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#9ca3af';

// An error the user has already seen as a toast. Only these are swallowed by event handlers.
const shown = err => Object.assign(err, { shown: true });
async function api(path, method = 'GET', body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opt); }
  catch (e) { toast('Can’t reach the CRM server. Is it still running?', true); throw shown(e); }
  if (r.status === 204) return null;
  const data = await r.json().catch(() => null);
  if (!r.ok) {
    const d = data && data.detail;
    const msg = typeof d === 'string' ? d : Array.isArray(d) ? d.map(x => `${(x.loc || []).slice(-1)[0]}: ${x.msg}`).join('; ') : r.statusText;
    toast(msg, true); throw shown(new Error(msg));
  }
  return data;
}

const S = {
  view: 'deals', pipelines: [], pipelineId: null, deals: [], contacts: [], companies: [], tasks: [], acts: [], views: [],
  dealStatus: 'open', dealTab: 'table', group: 'stage', coldOnly: false, q: '', peopleStatus: '', taskFilter: 'open', actType: '',
  sort: { deals: ['monetary_value', -1], people: ['created_at', -1], companies: ['name', 1] },
  selected: new Set(), peek: null, saving: false, showAll: false,
};

async function loadAll() {
  const [p, d, c, co, t, a, v] = await Promise.all([
    api('/api/pipelines'), api(`/api/opportunities?limit=${LOAD_LIMIT}`), api(`/api/contacts?limit=${LOAD_LIMIT}`),
    api(`/api/companies?limit=${LOAD_LIMIT}`), api(`/api/tasks?limit=${LOAD_LIMIT}`), api(`/api/activities?limit=${LOAD_LIMIT}`), api('/api/saved-views'),
  ]);
  Object.assign(S, { pipelines: p, deals: d, contacts: c, companies: co, tasks: t, acts: a, views: v });
  // A full page means there may be more on the server: say so on screen, never imply it's everything.
  S.full = { deals: d.length >= LOAD_LIMIT, people: c.length >= LOAD_LIMIT, companies: co.length >= LOAD_LIMIT, tasks: t.length >= LOAD_LIMIT, activity: a.length >= LOAD_LIMIT };
  // Index once per load: last activity per deal, next open task per deal, and per-company rollups.
  S.lastActAt = new Map(); S.nextTaskOf = new Map(); S.peopleAt = new Map(); S.openValueAt = new Map();
  for (const x of a) if (x.opportunity_id && !(S.lastActAt.get(x.opportunity_id) >= x.created_at)) S.lastActAt.set(x.opportunity_id, x.created_at);
  for (const x of t) {
    if (!x.opportunity_id || x.status !== 'open') continue;
    const cur = S.nextTaskOf.get(x.opportunity_id);
    if (!cur || (x.due_date || '9999') < (cur.due_date || '9999')) S.nextTaskOf.set(x.opportunity_id, x);
  }
  for (const x of c) if (x.company_id) S.peopleAt.set(x.company_id, (S.peopleAt.get(x.company_id) || 0) + 1);
  for (const x of d) if (x.company_id && x.status === 'open') S.openValueAt.set(x.company_id, (S.openValueAt.get(x.company_id) || 0) + +x.monetary_value);
  if (!S.pipelines.find(x => x.id === S.pipelineId)) S.pipelineId = S.pipelines[0]?.id || null;
}
async function refresh() { await loadAll(); render(); if (S.peek && S.peek.id) renderPeek(); }

const pipeline = () => S.pipelines.find(p => p.id === S.pipelineId) || { stages: [] };
const stageOf = id => S.pipelines.flatMap(p => p.stages).find(s => s.id === id);
const contactName = c => [c.first_name, c.last_name].filter(Boolean).join(' ') || c.email || '(no name)';
const lastTouch = d => daysSince(S.lastActAt.get(d.id) || d.updated_at);
const isCold = d => d.status === 'open' && lastTouch(d) >= COLD_DAYS;
const allSel = rows => rows.length > 0 && rows.every(r => S.selected.has(r.id));
const nextTask = d => S.nextTaskOf.get(d.id);

function header(crumb, title, buttons = '', tabs = '') {
  $('#head').innerHTML = `<div class="head ${tabs ? 'tabbed' : ''}"><div class="crumb">${crumb}</div><div class="title-row"><h1>${esc(title)}</h1><div style="display:flex;gap:8px">${buttons}</div></div>${tabs}</div>`;

const seg = (act, cur, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-act="${act}" data-val="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const sortTh = (entity, key, label, icon, num) => {
  const [k, dir] = S.sort[entity];
  return `<th data-sort="${entity}:${key}" class="${num ? 'num' : ''}"><span class="t">${icon}</span>${label}${k === key ? (dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
};
function sortRows(entity, rows, get) {
  const [k, dir] = S.sort[entity];
  return rows.sort((a, b) => { const x = get(a, k), y = get(b, k); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
}

function renderTasks() {

  $('#toolbar').innerHTML = `<div class="toolbar">${seg('task-filter', S.taskFilter, [['open', 'Open'], ['done', 'Done'], ['all', 'All']])}${fullNote('tasks')}</div>`;
  const t0 = todayISO();
  const rows = S.tasks.filter(t => S.taskFilter === 'all' || t.status === S.taskFilter).sort((a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'));
  const groups = [['Overdue', t => t.status === 'open' && t.due_date && t.due_date < t0], ['Today', t => t.status === 'open' && t.due_date === t0], ['Upcoming', t => t.status === 'open' && t.due_date > t0], ['No date', t => t.status === 'open' && !t.due_date], ['Done', t => t.status === 'done']];
  const line = t => `<tr class="row"><td><input type="checkbox" data-toggle-task="${t.id}" ${t.status === 'done' ? 'checked' : ''}></td>
    <td><div class="cell-main"><span contenteditable spellcheck="false" data-edit="task:${t.id}:title" style="${t.status === 'done' ? 'text-decoration:line-through;color:var(--ink-3)' : ''}">${esc(t.title)}</span><button class="open" data-act="peek" data-kind="task" data-id="${t.id}">Open ↗</button></div></td>
    <td><input type="date" class="pick" data-change="task-due" data-id="${t.id}" value="${esc(t.due_date || '')}"></td>
    <td>${t.opportunity_name ? `<a class="muted" data-act="peek" data-kind="deal" data-id="${t.opportunity_id}" style="cursor:pointer">${esc(t.opportunity_name)}</a>` : ''}</td>
    <td>${t.contact_name ? `<span class="person"><span class="av">${esc(initials(t.contact_name))}</span>${esc(t.contact_name)}</span>` : ''}</td>
    <td class="muted" style="max-width:280px;overflow:hidden;text-overflow:ellipsis">${esc(t.notes || '')}</td></tr>`;
  let body = '';
  const ordered = groups.flatMap(([, fn]) => rows.filter(fn)); const drawn = new Set(capped(ordered).map(t => t.id));

    body += `<tr class="group"><td></td><td colspan="5"><b class="${name === 'Overdue' ? 'late' : ''}">${name}</b><span class="mono muted">${g.length}</span></td></tr>` + shownRows.map(line).join('');

}

async function savePeek() {
  if (S.saving) return; S.saving = true;
  try {
    const { kind, id } = S.peek; const K = KIND[kind];
    const data = Object.fromEntries(new FormData($('#peek-form')).entries());
    if (kind === 'deal') {
      data.monetary_value = parseFloat(data.monetary_value) || 0;
      if (!data.name?.trim()) return toast('A deal needs a name', true);
      if (!data.stage_id) return toast('That pipeline has no stages yet. Add one under Pipelines first.', true);
      // Let the server keep status in step with Won/Lost stages: only send status
      // when the user actually changed it, and start new deals in Won/Lost closed.
      const rec = id && S.deals.find(x => x.id === id);
      const stageName = (stageOf(data.stage_id)?.name || '').toLowerCase();
      if (rec && data.status === rec.status && data.stage_id !== rec.stage_id) delete data.status;
      if (!rec && data.status === 'open' && ['won', 'lost'].includes(stageName)) data.status = stageName;
    }
    if (kind === 'person') data.tags = (data.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    if (kind === 'company' && !data.name?.trim()) return toast('A company needs a name', true);
    if (kind === 'task' && !data.title?.trim()) return toast('A task needs a title', true);
    const saved = id ? await api(`${K.path}/${id}`, 'PUT', data) : await api(K.path, 'POST', data);
    toast(id ? 'Saved' : `${K.label} created`);
    S.peek = { kind, id: saved.id, preset: {} };
    await refresh();
  } finally { S.saving = false; }
}

let palItems = [], palIdx = 0, palTimer;
function openPal() { $('#veil').classList.add('on'); $('#pal').classList.add('on'); $('#pal-q').value = ''; runPal('').catch(quiet); setTimeout(() => $('#pal-q').focus(), 10); }
function closePal() { $('#veil').classList.remove('on'); $('#pal').classList.remove('on'); }
async function runPal(q) {
  const cmds = [['+', 'New deal', 'command', () => openPeek('deal', null, { pipeline_id: S.pipelineId, stage_id: pipeline().stages[0]?.id })], ['+', 'New person', 'command', () => openPeek('person')], ['+', 'New company', 'command', () => openPeek('company')], ['+', 'New task', 'command', () => openPeek('task')],
    ['◷', 'Show deals going cold', 'view', () => go('deals', { coldOnly: true })], ['▤', 'Reports', 'view', () => go('reports')]].filter(c => !q || c[1].toLowerCase().includes(q.toLowerCase()));
  let recs = [];
  if (q.trim().length >= 2) {
    const r = await api('/api/search?q=' + encodeURIComponent(q.trim()) + '&limit=6');
    recs = [...r.contacts.map(c => ['@', contactName(c), c.company_name || 'person', () => { go('people'); openPeek('person', c.id); }]),
      ...r.companies.map(c => ['▢', c.name, c.industry || 'company', () => { go('companies'); openPeek('company', c.id); }]),
      ...r.opportunities.map(o => ['$', o.name, (o.contact_name || '') + ' · ' + money(o.monetary_value), () => { go('deals'); openPeek('deal', o.id); }])];
  }
  palItems = [...recs, ...cmds]; palIdx = 0; drawPal();
}
function drawPal() {
  $('#pal-list').innerHTML = palItems.length ? palItems.map((it, i) => `<div class="pal-it ${i === palIdx ? 'on' : ''}" data-act="pal-run" data-i="${i}"><span class="mono muted">${it[0]}</span>${esc(it[1])}<span class="sub">${esc(it[2])}</span></div>`).join('') : '<div class="pal-sec">No matches</div>';
}
$('#pal-q').addEventListener('input', e => { clearTimeout(palTimer); palTimer = setTimeout(() => runPal(e.target.value).catch(quiet), 150); });
$('#pal-q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palIdx = Math.min(palIdx + 1, palItems.length - 1); drawPal(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { palIdx = Math.max(palIdx - 1, 0); drawPal(); e.preventDefault(); }

document.addEventListener('click', e => onClick(e).catch(quiet));

  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;

  else if (a === 'deal-tab') { S.dealTab = d.val; render(); }
  else if (a === 'deal-status') { S.dealStatus = d.val; render(); }
  else if (a === 'group') { S.group = d.val; render(); }
  else if (a === 'people-status') { S.peopleStatus = d.val; render(); }
  else if (a === 'task-filter') { S.taskFilter = d.val; render(); }
  else if (a === 'act-type') { S.actType = d.val; render(); }
  else if (a === 'act-kind') { S.actKind = d.val; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); }
  else if (a === 'peek') { if (e.target.closest('.card') && e.target.closest('.card').classList.contains('dragging')) return; openPeek(d.kind, d.id); }
  else if (a === 'close-peek') closePeek();
  else if (a === 'new') {
    const preset = {};
    if (d.kind === 'deal') Object.assign(preset, { pipeline_id: S.pipelineId, stage_id: pipeline().stages[0]?.id, contact_id: d.presetContact || null, company_id: d.presetCompany || null });
    if (d.kind === 'task') Object.assign(preset, { opportunity_id: d.presetDeal || null, contact_id: d.presetContact || null });
    openPeek(d.kind, null, preset);

  else if (a === 'delete') {

  else if (d.change === 'pipeline') { S.pipelineId = t.value; render(); }
  else if (d.change === 'stage') { await api(`/api/opportunities/${d.id}/stage`, 'PATCH', { stage_id: t.value }); await refresh(); }
  else if (d.change === 'bulk-stage' && t.value) { for (const id of S.selected) await api(`/api/opportunities/${id}/stage`, 'PATCH', { stage_id: t.value }); S.selected = new Set(); toast('Moved'); await refresh(); }
  else if (d.change === 'task-due') { await api(`/api/tasks/${d.id}`, 'PUT', { due_date: t.value }); await refresh(); }
  else if (d.change === 'peek-pipeline') {
    const p = S.pipelines.find(x => x.id === t.value); const sel = $('#peek-form [name=stage_id]');
    sel.innerHTML = p.stages.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  }
  else if (d.change === 'pipe-name' && t.value.trim()) { await api('/api/pipelines/' + d.id, 'PUT', { name: t.value.trim() }); await refresh(); }
  else if (d.change === 'stage-name' && t.value.trim()) { await api(`/api/pipelines/${d.pid}/stages/${d.id}`, 'PUT', { name: t.value.trim() }); await refresh(); }
  else if (d.change === 'stage-color') { await api(`/api/pipelines/${d.pid}/stages/${d.id}`, 'PUT', { color: t.value }); await refresh(); }
}
let qTimer;
document.addEventListener('input', e => {
  if (e.target.dataset.input !== 'q') return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    const f0 = document.querySelector('[data-input=q]'); if (!f0) return;
    S.q = f0.value; S.showAll = false; const pos = f0.selectionStart; render();
    const f = document.querySelector('[data-input=q]'); if (f) { f.focus(); f.setSelectionRange(pos, pos); }
  }, 180);
});
document.addEventListener('keydown', e => onKey(e).catch(quiet));
async function onKey(e) {
  const t = e.target;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); return; }
  if (e.key === 'Escape' && !t.isContentEditable) { if ($('#pal').classList.contains('on')) closePal(); else closePeek(); return; }
  if (t.dataset && t.dataset.addStage && e.key === 'Enter' && t.value.trim()) { await api(`/api/pipelines/${t.dataset.addStage}/stages`, 'POST', { name: t.value.trim() }); await refresh(); return; }
  if (t.isContentEditable && e.key === 'Enter') { e.preventDefault(); t.blur(); }
  if (t.isContentEditable && e.key === 'Escape') {
    const [kind, id, field] = (t.dataset.edit || '').split(':'); const rec = KIND[kind]?.list().find(x => x.id === id);
    if (rec) t.textContent = field === 'monetary_value' ? money(rec[field]) : (rec[field] ?? '');
    t.blur();
  }
}
/* Inline edits save on blur */
document.addEventListener('focusout', e => onBlur(e).catch(quiet));
async function onBlur(e) {
  const t = e.target; if (!t.isContentEditable || !t.dataset.edit) return;
  const [kind, id, field] = t.dataset.edit.split(':'); const K = KIND[kind]; const rec = K.list().find(x => x.id === id); if (!rec) return;
  let val = t.textContent.trim();
  if (field === 'monetary_value') {
    const raw = val.replace(/[$,\s]/g, '');
    if (!/^\d+(\.\d{1,2})?$/.test(raw)) { toast('Enter an amount like 1500 or 1,500.50', true); t.textContent = money(rec[field]); return; }
    val = parseFloat(raw);
  }
  if (val === (rec[field] ?? '') || (field === 'monetary_value' && val === +rec[field])) { if (field === 'monetary_value') t.textContent = money(val); return; }
  if ((field === 'name' || field === 'title') && !val) { toast('That field can’t be empty', true); t.textContent = rec[field]; return; }
  try { await api(`${K.path}/${id}`, 'PUT', { [field]: val }); toast('Saved'); } catch (err) { /* toast shown */ }
  await refresh();
}
/* Board drag and drop */
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag]'); if (c) { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragend', e => { const c = e.target.closest?.('[data-drag]'); if (c) setTimeout(() => c.classList.remove('dragging'), 0); });
document.addEventListener('dragover', e => { const col = e.target.closest('[data-drop]'); if (col) { e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('dragleave', e => { const col = e.target.closest('[data-drop]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', e => onDrop(e).catch(quiet));
async function onDrop(e) {
  const col = e.target.closest('[data-drop]'); if (!col) return; e.preventDefault(); col.classList.remove('over');
  const id = e.dataTransfer.getData('text/plain'); const deal = S.deals.find(x => x.id === id);
  if (!deal || deal.stage_id === col.dataset.drop) return;
  const updated = await api(`/api/opportunities/${id}/stage`, 'PATCH', { stage_id: col.dataset.drop });
  toast(`Moved to ${updated.stage_name}${updated.status !== 'open' ? ' · marked ' + updated.status : ''}`); await refresh();
}

loadAll().then(render).catch(err => {
  const fromFile = location.protocol === 'file:';
  $('#head').innerHTML = `<div class="head"><div class="crumb">Specter CRM</div><div class="title-row"><h1>${fromFile ? 'This page needs its server' : 'Can’t reach the CRM server'}</h1></div></div>`;
  $('#body').innerHTML = `<div class="empty" style="max-width:640px;line-height:1.7">
    ${fromFile ? 'You opened <b>index.html</b> directly, so there’s no server to load data from.' : `The server didn’t answer (${esc(err.message)}).`}
    Start it from the repo root, then open <b>http://localhost:8090</b>:<br><br>
    <b>Windows:</b> double-click <span class="mono">crm/launch.bat</span><br>
    <b>macOS / Linux:</b> <span class="mono">sh crm/launch.sh</span><br><br>
    Both offer to load fictional demo data the first time.</div>`;
});
</script>
