<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Specter CRM · Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ── Today: the CRM opens to who needs you, not to a database ──────────────
     Editorial calm. Warm paper, one yellow, one near-black used at different
     opacities. Serif for the human parts (names, what was said); sans for the rest. */
  :root {
    --paper: #fbf7ef; --stone: #f2ede4; --sun: #ffe459; --ink: #141414;
    --o80: rgba(20,20,20,.8); --o60: rgba(20,20,20,.6); --o40: rgba(20,20,20,.42); --o20: rgba(20,20,20,.16); --o10: rgba(20,20,20,.08);
    --late: #b3261e;
    --serif: 'Instrument Serif', serif; --sans: 'Manrope', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 400 15px/1.55 var(--sans); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--ink); color: var(--sun); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .dots { position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(var(--ink) 1px, transparent 1px); background-size: 36px 36px; opacity: .045; }

  .app { display: grid; grid-template-columns: 200px minmax(0, 1fr) 380px; min-height: 100vh; position: relative; }
  .rail { padding: 34px 28px; display: flex; flex-direction: column; gap: 42px; border-right: 1px solid var(--o10); position: sticky; top: 0; height: 100vh; }
  .word { font: italic 400 27px/1 var(--serif); letter-spacing: -.02em; }
  .rail nav { display: flex; flex-direction: column; gap: 12px; }
  .rail a { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--o40); text-decoration: none; cursor: pointer; transition: color .3s; }
  .rail a:hover { color: var(--ink); }
  .rail a.on { color: var(--ink); }
  .rail a.on::before { content: "— "; }
  .rail .foot { margin-top: auto; font-size: 11px; color: var(--o40); letter-spacing: .08em; text-transform: uppercase; }

  main { padding: 44px 56px 80px; max-width: 820px; }
  .date { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: var(--o40); }
  h1 { font: 400 60px/1.02 var(--serif); letter-spacing: -.025em; margin: 14px 0 12px; }
  h1 em { font-style: italic; background: linear-gradient(transparent 62%, var(--sun) 62%, var(--sun) 92%, transparent 92%); padding: 0 4px; }
  .lede { color: var(--o60); font-weight: 300; max-width: 520px; }
  .rule { height: 1px; background: var(--o20); margin: 34px 0 6px; }

  .group { margin-top: 30px; }
  .group-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--o20); padding-bottom: 8px; }
  .group-head h2 { font: italic 400 26px var(--serif); letter-spacing: -.01em; }
  .group-head span { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: var(--o40); }
  .group.late h2 { color: var(--late); }

  .item { display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: start; padding: 16px 10px 16px 0; border-bottom: 1px solid var(--o10); cursor: pointer; transition: background .3s, opacity .5s, transform .5s; position: relative; }
  .item:hover { background: linear-gradient(90deg, transparent, var(--stone) 12%, var(--stone) 88%, transparent); }
  .item.sel { background: var(--stone); }
  .item.sel::before { content: ""; position: absolute; left: -22px; top: 50%; width: 12px; height: 1px; background: var(--ink); }
  .item.done { opacity: 0; transform: translateX(40px); }
  .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.2px solid var(--ink); margin-top: 3px; display: grid; place-items: center; transition: background .2s; }
  .tick:hover { background: var(--sun); }
  .tick:hover::after { content: "✓"; font-size: 12px; }
  .what { font-size: 16px; }
  .what b { font: 400 21px/1 var(--serif); letter-spacing: -.01em; }
  .meta { font-size: 12.5px; color: var(--o60); margin-top: 4px; }
  .meta .late { color: var(--late); font-weight: 600; }
  .acts { display: flex; gap: 6px; opacity: 0; transition: opacity .25s; }
  .item:hover .acts, .item.sel .acts { opacity: 1; }
  .acts button { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; border: 1px solid var(--ink); border-radius: 999px; padding: 5px 11px; transition: background .25s, color .25s; }
  .acts button:hover { background: var(--ink); color: var(--paper); }

  .zero { display: none; margin-top: 40px; background: var(--sun); padding: 48px 40px; text-align: center; }
  .zero.on { display: block; }
  .zero p { font: italic 400 38px/1.1 var(--serif); }

  /* Dossier */
  .dossier { border-left: 1px solid var(--o10); background: var(--stone); padding: 44px 34px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: var(--o40); margin-bottom: 10px; display: block; }
  .dossier h3 { font: 400 42px/1 var(--serif); letter-spacing: -.02em; }
  .dossier .role { color: var(--o60); margin-top: 6px; font-size: 14px; }
  .contact-line { display: flex; gap: 8px; margin: 20px 0 6px; }
  .contact-line button { border: 1px solid var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
  .contact-line button:first-child { background: var(--ink); color: var(--paper); }
  .quote { font: italic 400 24px/1.2 var(--serif); margin: 26px 0; padding-left: 16px; border-left: 2px solid var(--sun); }
  .quote small { display: block; font: 400 12px var(--sans); color: var(--o40); margin-top: 8px; font-style: normal; letter-spacing: .06em; }
  .facts { border-top: 1px solid var(--o20); }
  .facts div { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--o20); font-size: 14px; }
  .facts span:first-child { color: var(--o60); }
  .story { margin-top: 26px; }
  .story div { padding: 10px 0 10px 18px; border-left: 1px solid var(--o20); position: relative; font-size: 14px; }
  .story div::before { content: ""; position: absolute; left: -4px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
  .story small { display: block; color: var(--o40); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
  .week p { font: 400 26px/1.25 var(--serif); letter-spacing: -.01em; }
  .week p em { background: var(--sun); font-style: italic; padding: 0 4px; }
  .stagebars { margin-top: 30px; }
  .stagebars div { display: grid; grid-template-columns: 110px 1fr 60px; gap: 12px; align-items: center; font-size: 13px; padding: 7px 0; }
  .stagebars i { height: 1px; background: var(--ink); display: block; }
  .stagebars b { font-weight: 500; text-align: right; }
  .fade { animation: fade .6s cubic-bezier(.16,1,.3,1); }
  @keyframes fade { from { opacity: 0; transform: translateY(12px); } }
</style>
</head>
<body>
<div class="dots"></div>
<div class="app">
  <aside class="rail">
    <div class="word">Specter</div>
    <nav><a class="on">Today</a><a>Pipeline</a><a>People</a><a>Companies</a><a>Reports</a></nav>
    <div class="foot">Design 3 / 5<br />Today</div>
  </aside>

  <main>
    <div class="date">Sunday · September 27</div>
    <h1 id="headline"></h1>
    <p class="lede">Worked top to bottom, this list is the whole job. Everything else in the CRM is there to support it.</p>
    <div class="rule"></div>
    <div id="queue"></div>
    <div class="zero" id="zero"><p>That's everyone.<br />Go do the work only you can do.</p></div>
  </main>

  <aside class="dossier" id="dossier"></aside>
</div>

<script>
const PEOPLE = {
  tom: { name: 'Tom Okafor', role: 'Operations · Brightwater Property Management', deal: 'Tenant request intake', value: 1497, stage: 'Proposal sent', said: 'We get forty-plus requests a week, and half of them come in by voicemail.', saidWhen: 'Call · 12 days ago', story: [['Call', 'Walked through current intake. 40+ requests a week.', 'Sep 15'], ['Proposal', 'Sent: $1,497.', 'Sep 15']] },
  marcus: { name: 'Marcus Ellery', role: 'Office Manager · Northgate Dental Group', deal: 'Appointment reminders + recall', value: 794, stage: 'Contacted', said: 'No-shows are what hurt us. Two locations, same problem.', saidWhen: 'Email · 9 days ago', story: [['Email', 'Sent summary of the reminder workflow and pricing.', 'Sep 18']] },
  grace: { name: 'Grace Holloway', role: 'Billing · Northgate Dental Group', deal: 'Billing follow-up workflow', value: 497, stage: 'Contacted', said: 'I’d want to see it working before I take it to the doctors.', saidWhen: 'Email · 15 days ago', story: [['Email', 'Asked for a demo before deciding.', 'Sep 12']] },
  dana: { name: 'Dana Whitfield', role: 'Owner · Harborline Plumbing', deal: 'After-hours call answering', value: 497, stage: 'New lead', said: 'June to September I’m answering the phone from the truck.', saidWhen: 'Call · 2 days ago', story: [['Call', 'Intro call. Busiest months are June to September.', 'Sep 25']] },
  priya: { name: 'Priya Sandoval', role: 'Owner · Cedar & Pine Landscaping', deal: 'Review request automation', value: 297, stage: 'Qualified', said: 'The two companies next to us have three or four times our reviews.', saidWhen: 'Note · yesterday', story: [['Note', 'Competitors nearby have 3-4x the review count.', 'Sep 26']] },
  jenna: { name: 'Jenna Kowalski', role: 'Owner · Summit Roofing Co.', deal: 'Storm-season lead capture', value: 997, stage: 'Qualified', said: 'After a storm the phone rings off the hook and it all goes to voicemail.', saidWhen: 'SMS · today', story: [['SMS', 'Confirmed demo for Thursday 10am.', 'Sep 27']] },
  luis: { name: 'Luis Ferreira', role: 'Practice Manager · Lumen Physical Therapy', deal: 'New patient intake forms', value: 1297, stage: 'Won', said: 'Signed. We’ll need the EHR export format before kickoff.', saidWhen: 'Note · 3 days ago', story: [['Note', 'Contract signed. Needs EHR export format.', 'Sep 24']] },
};
const QUEUE = [
  { g: 'Overdue', cls: 'late', items: [{ id: 'a', p: 'tom', what: 'Follow up with <b>Tom Okafor</b> on the proposal', meta: '<span class="late">2 days late</span> · $1,497 · proposal sent 12 days ago' }] },
  { g: 'Going quiet', items: [
    { id: 'b', p: 'grace', what: 'Offer <b>Grace Holloway</b> the demo she asked for', meta: 'No contact in 15 days · $497' },
    { id: 'c', p: 'marcus', what: 'Check in with <b>Marcus Ellery</b> about no-shows', meta: 'No contact in 9 days · $794' },
  ] },
  { g: 'New, not yet worked', items: [{ id: 'd', p: 'dana', what: 'Send <b>Dana Whitfield</b> a recap of your call', meta: 'Harborline Plumbing · $497 · first call 2 days ago' }] },
  { g: 'Coming up this week', items: [
    { id: 'e', p: 'priya', what: 'Send <b>Priya Sandoval</b> the proposal', meta: 'Monday · include the review-count comparison' },
    { id: 'f', p: 'jenna', what: 'Prep the demo for <b>Jenna Kowalski</b>', meta: 'Wednesday · demo is Thursday 10am' },
  ] },
];
const WORDS = ['No things', 'One thing', 'Two things', 'Three things', 'Four things', 'Five things', 'Six things', 'Seven things'];
const $ = s => document.querySelector(s);
const money = n => '$' + n.toLocaleString('en-US');
let selected = 'a';

function remaining() { return QUEUE.flatMap(g => g.items).filter(i => !i.done); }

function renderQueue() {
  const left = remaining().length;
  $('#headline').innerHTML = left ? `Good morning.<br><em>${WORDS[left]}</em> need${left === 1 ? 's' : ''} you.` : `Good morning.<br><em>You're clear.</em>`;
  $('#queue').innerHTML = QUEUE.map(g => {
    const items = g.items.filter(i => !i.done);
    if (!items.length) return '';
    return `<section class="group ${g.cls || ''}"><div class="group-head"><h2>${g.g}</h2><span>${items.length}</span></div>
      ${items.map(i => `<div class="item ${i.id === selected ? 'sel' : ''}" data-id="${i.id}">
        <button class="tick" data-done="${i.id}" title="Mark done"></button>
        <div><div class="what">${i.what}</div><div class="meta">${i.meta}</div></div>
        <div class="acts"><button data-done="${i.id}">Done</button><button data-done="${i.id}">Snooze</button><button>Log call</button></div>
      </div>`).join('')}</section>`;
  }).join('');
  $('#zero').classList.toggle('on', !left);
  document.querySelectorAll('.item').forEach(el => el.onclick = () => { selected = el.dataset.id; renderQueue(); renderDossier(); });
  document.querySelectorAll('[data-done]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const row = b.closest('.item'); row.classList.add('done');
    setTimeout(() => { QUEUE.flatMap(g => g.items).find(i => i.id === b.dataset.done).done = true; if (selected === b.dataset.done) selected = remaining()[0]?.id; renderQueue(); renderDossier(); }, 420);
  });
}

function renderDossier() {
  const item = QUEUE.flatMap(g => g.items).find(i => i.id === selected && !i.done);
  if (!item) {
    $('#dossier').innerHTML = `<div class="week fade"><span class="label">This week, in a sentence</span>
      <p><em>$4,579</em> is open across six deals. One won this month: Lumen Physical Therapy, $1,297. The deal most at risk is Brightwater, waiting twelve days on a proposal.</p>
      <div class="stagebars">${[['New lead', 497], ['Contacted', 1291], ['Qualified', 1294], ['Proposal sent', 1497]].map(([s, v]) => `<div><span>${s}</span><i style="width:${v / 1497 * 100}%"></i><b>${money(v)}</b></div>`).join('')}</div></div>`;
    return;
  }
  const p = PEOPLE[item.p];
  $('#dossier').innerHTML = `<div class="fade"><span class="label">Who</span><h3>${p.name}</h3><div class="role">${p.role}</div>
    <div class="contact-line"><button>Call</button><button>Text</button><button>Email</button></div>
    <div class="quote">“${p.said}”<small>${p.saidWhen}</small></div>
    <div class="facts"><div><span>Deal</span><span>${p.deal}</span></div><div><span>Value</span><span>${money(p.value)}</span></div><div><span>Stage</span><span>${p.stage}</span></div></div>
    <div class="story"><span class="label">The story so far</span>${p.story.map(([t, b, w]) => `<div><small>${t} · ${w}</small>${b}</div>`).join('')}</div></div>`;
}
renderQueue(); renderDossier();
</script>
</body>
</html>
