<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #1e1e1e;
      --bg-input:   #2d2d2d;
      --bg-user:    #2a2d2e;
      --bg-tool:    #252526;
      --border:     #3c3c3c;
      --text:       #d4d4d4;
      --text-muted: #6a9955;
      --text-dim:   #858585;
      --accent:     #569cd6;
      --green:      #4ec9b0;
      --red:        #f44747;
      --font:       'Consolas', 'Courier New', monospace;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: #252526;
      height: 36px;
      user-select: none;
    }
    #header-title { font-size: 12px; font-weight: bold; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #858585; flex-shrink: 0; }
    #status-dot.connected { background: var(--green); }
    #status-dot.error { background: var(--red); }
    #status-label { font-size: 11px; color: var(--text-dim); flex: 1; }

    #clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 11px;
    }
    #clear-btn:hover:not(:disabled) { background: var(--bg-tool); color: var(--text); }
    #clear-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
    }

    .message {
      padding: 6px 14px;
      line-height: 1.55;
      max-width: 100%;
    }

    .message.user {
      background: var(--bg-user);
      border-left: 2px solid var(--accent);
    }
    .message.user .role-label { color: var(--accent); font-size: 11px; }

    .message.assistant { border-left: 2px solid transparent; }
    .message.assistant .role-label { color: var(--green); font-size: 11px; }

    .role-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; gap: 8px; }
    .role-row-right { display: flex; align-items: baseline; gap: 8px; }
    .timestamp { font-size: 10px; color: var(--text-dim); opacity: 0.7; }

    .copy-btn {
      font-size: 10px;
      color: var(--text-dim);
      opacity: 0.6;
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      font-family: var(--font);
      padding: 0;
    }
    .copy-btn:hover { opacity: 1; color: var(--text); }

    .message .content { white-space: pre-wrap; word-break: break-word; }

    /* Markdown overrides */
    .message .content h1, .content h2, .content h3 { color: var(--text); margin: 8px 0 4px; font-size: 13px; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
    .message .content code { background: #0d0d0d; padding: 1px 4px; border-radius: 3px; font-family: var(--font); color: #ce9178; }
    .message .content pre { background: #0d0d0d; padding: 8px; border-radius: 4px; overflow-x: auto; margin: 6px 0; }
    .message .content pre code { background: none; padding: 0; color: var(--text); }
    .message .content strong { color: #dcdcaa; }
    .message .content em { color: #c586c0; font-style: normal; }
    .message .content a { color: var(--accent); }
    .message .content ul, .content ol { padding-left: 18px; margin: 4px 0; }
    .message .content blockquote { border-left: 3px solid var(--border); padding-left: 8px; color: var(--text-dim); margin: 4px 0; }
    .message .content table { border-collapse: collapse; width: 100%; margin: 6px 0; }
    .message .content th, .content td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
    .message .content th { background: #252526; }

    /* Tool use lines */
    .tool-line {
      padding: 3px 14px;
      color: var(--text-dim);
      font-size: 11px;
      font-style: italic;
    }
    .tool-line .tool-icon { margin-right: 4px; }
    .tool-line .tool-path { color: #858585; }

    /* Streaming cursor */
    .cursor { display: inline-block; width: 7px; height: 13px; background: var(--text); animation: blink 1s step-end infinite; vertical-align: text-bottom; margin-left: 1px; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Thinking indicator */
    .thinking { color: var(--text-dim); font-style: italic; font-size: 12px; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

    /* ── Layout ── */
    body { display: flex; flex-direction: column; }
    #main { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

    /* ── Input area ── */
    #input-area {
      border-top: 1px solid var(--border);
      background: var(--bg-input);
      padding: 8px 14px;
      position: relative;
    }

    #autocomplete {
      position: absolute;
      bottom: calc(100% + 2px);
      left: 14px;
      background: #252526;
      border: 1px solid var(--border);
      border-radius: 4px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
      min-width: 200px;
      z-index: 10;
    }
    .ac-item {
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .ac-item:hover, .ac-item.selected { background: #094771; color: #fff; }
    .ac-item .ac-slash { color: var(--accent); }

    #input-row { display: flex; gap: 8px; align-items: flex-end; }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      padding: 2px 0;
    }
    #input::placeholder { color: var(--text-dim); }

    #send-btn {
      background: #0e639c;
      border: none;
      color: #fff;
      padding: 4px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #send-btn:hover { background: #1177bb; }
    #send-btn:disabled { background: #3c3c3c; cursor: default; color: var(--text-dim); }

    #hint { font-size: 10px; color: var(--text-dim); margin-top: 4px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }

    /* Error banner */
    #error-banner {
      display: none;
      background: #5a1d1d;
      color: #f48771;
      padding: 6px 14px;
      font-size: 12px;
      border-bottom: 1px solid var(--red);
    }
  </style>
  <link rel="stylesheet" href="/static/highlight-vs2015.min.css">
</head>
<body>

<div id="header">
  <div id="status-dot"></div>
  <div id="header-title">Claude Code</div>
  <div id="status-label">Connecting…</div>
  <button id="clear-btn" title="Clear conversation and start fresh" disabled>Clear</button>
</div>

<div id="error-banner"></div>

<div id="main">
  <div id="messages"></div>
  <div id="input-area">
    <div id="autocomplete"></div>
    <div id="input-row">
      <textarea id="input" rows="1" placeholder="Ask anything, or type / for commands…"></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
    <div id="hint">Enter to send · Shift+Enter for new line</div>
  </div>
</div>

<script src="/static/marked.min.js"></script>
<script src="/static/highlight.min.js"></script>
<script>
(function () {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────
  const WS_URL = `ws://${location.host}/ws`;
  const COMMANDS_URL = `${location.origin}/api/commands`;

  const TOOL_ICONS = {
    Read: '📄', Write: '✏️', Edit: '✏️', MultiEdit: '✏️',
    Bash: '⚡', Glob: '🔍', Grep: '🔍',
    WebFetch: '🌐', WebSearch: '🌐',
    TodoWrite: '📋', Skill: '🎯', Agent: '🤖',
  };
  const TOOL_VERBS = {
    Read: 'Reading', Write: 'Writing', Edit: 'Editing', MultiEdit: 'Editing',
    Bash: 'Running', Glob: 'Searching', Grep: 'Searching',
    WebFetch: 'Fetching', WebSearch: 'Searching web',
    TodoWrite: 'Updating tasks', Skill: 'Running skill', Agent: 'Spawning agent',
  };

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const messagesEl    = document.getElementById('messages');
  const inputEl       = document.getElementById('input');
  const sendBtn       = document.getElementById('send-btn');
  const statusDot     = document.getElementById('status-dot');
  const statusLabel   = document.getElementById('status-label');
  const autocomplete  = document.getElementById('autocomplete');
  const errorBanner   = document.getElementById('error-banner');
  const clearBtn      = document.getElementById('clear-btn');

  // ── State ────────────────────────────────────────────────────────────────
  let ws = null;
  let commands = [];
  let acIndex = -1;
  let currentAssistantEl = null;   // div.message.assistant currently streaming
  let currentContentEl = null;     // div.content inside it
  let currentTsEl = null;          // span.timestamp inside current assistant message
  let cursorEl = null;             // blinking cursor
  let thinkingEl = null;           // "Thinking…" pulse shown before first output
  let currentText = '';            // accumulated text for current turn
  let waiting = false;             // true while Claude is responding

  // ── marked config ─────────────────────────────────────────────────────
  marked.setOptions({ breaks: true, gfm: true });

  // ── WebSocket ────────────────────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      setStatus('connected', 'Connected');
      sendBtn.disabled = false;
      clearBtn.disabled = false;
    };

    ws.onclose = () => {
      setStatus('error', 'Disconnected — reload to reconnect');
      sendBtn.disabled = true;
      clearBtn.disabled = true;
      setTimeout(connect, 3000);
    };

    ws.onerror = () => {
      setStatus('error', 'Connection error');
    };

    ws.onmessage = (ev) => {
      const event = JSON.parse(ev.data);
      handleEvent(event);
    };
  }

  function setStatus(state, label) {
    statusDot.className = state;
    statusLabel.textContent = label;
  }

  // ── Event handling ────────────────────────────────────────────────────────
  function handleEvent(event) {
    switch (event.type) {

      case 'history':
        messagesEl.innerHTML = '';
        for (const msg of event.messages) {
          renderHistoryMessage(msg);
        }
        scrollBottom();
        break;

      case 'user_echo':
        appendUserMessage(event.content, event.timestamp);
        startAssistantMessage();
        scrollBottom();
        break;

      case 'text_chunk':
        if (!currentAssistantEl) startAssistantMessage();
        currentText += event.content;
        renderStreamingText();
        scrollBottom();
        break;

      case 'tool_use':
        appendToolLine(event.name, event.input);
        scrollBottom();
        break;

      case 'tool_result':
        // No-op in display; tool start line already shown
        break;

      case 'waiting':
        setWaiting(event.value);
        if (event.value && !currentAssistantEl) startAssistantMessage();
        break;

      case 'done':
        finalizeAssistantMessage(event.timestamp);
        setWaiting(false);
        if (event.is_error) {
          showError('Claude returned an error. Check the server log.');
        }
        break;

      case 'error':
        showError(event.message || 'Unknown error');
        setWaiting(false);
        finalizeAssistantMessage();
        break;
    }
  }

  // ── Message rendering ─────────────────────────────────────────────────────
  function renderHistoryMessage(msg) {
    if (msg.role === 'user') {
      appendUserMessage(msg.content, msg.timestamp);
    } else if (msg.role === 'assistant') {
      const { el, contentEl, tsEl } = createAssistantMessage();
      if (msg.tools && msg.tools.length > 0) {
        for (const t of msg.tools) {
          appendToolLineToParent(el, t.name, t.input_summary || '');
        }
      }
      contentEl.innerHTML = msg.content ? marked.parse(msg.content) : '';
      el.dataset.rawText = msg.content || '';
      highlightCodeBlocks(contentEl);
      if (msg.timestamp) tsEl.textContent = formatTime(msg.timestamp);
      messagesEl.appendChild(el);
    }
  }

  function appendUserMessage(text, timestamp) {
    const el = document.createElement('div');
    el.className = 'message user';
    el.innerHTML = `<div class="role-row"><span class="role-label">You</span><span class="timestamp">${timestamp ? formatTime(timestamp) : ''}</span></div><div class="content">${escapeHtml(text)}</div>`;
    messagesEl.appendChild(el);
  }

  function createAssistantMessage() {
    const el = document.createElement('div');
    el.className = 'message assistant';
    el.dataset.rawText = '';
    const roleRow = document.createElement('div');
    roleRow.className = 'role-row';
    const roleLabel = document.createElement('span');
    roleLabel.className = 'role-label';
    roleLabel.textContent = 'Claude';
    const right = document.createElement('span');
    right.className = 'role-row-right';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.type = 'button';
    copyBtn.textContent = 'Copy';
    const tsEl = document.createElement('span');
    tsEl.className = 'timestamp';
    right.appendChild(copyBtn);
    right.appendChild(tsEl);
    roleRow.appendChild(roleLabel);
    roleRow.appendChild(right);
    el.appendChild(roleRow);
    const contentEl = document.createElement('div');
    contentEl.className = 'content';
    el.appendChild(contentEl);
    return { el, contentEl, tsEl };
  }

  function startAssistantMessage() {
    const { el, contentEl, tsEl } = createAssistantMessage();
    currentAssistantEl = el;
    currentContentEl = contentEl;
    currentTsEl = tsEl;
    currentText = '';
    thinkingEl = document.createElement('span');
    thinkingEl.className = 'thinking';
    thinkingEl.textContent = 'Thinking…';
    cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';
    contentEl.appendChild(thinkingEl);
    contentEl.appendChild(cursorEl);
    messagesEl.appendChild(el);
  }

  function clearThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  function renderStreamingText() {
    if (!currentContentEl) return;
    clearThinking();
    const html = currentText ? marked.parse(currentText) : '';
    currentContentEl.innerHTML = html;
    currentContentEl.appendChild(cursorEl);
  }

  function finalizeAssistantMessage(timestamp) {
    clearThinking();
    if (currentContentEl && currentText) {
      currentContentEl.innerHTML = marked.parse(currentText);
      highlightCodeBlocks(currentContentEl);
    } else if (currentContentEl && cursorEl) {
      cursorEl.remove();
    }
    if (currentAssistantEl) currentAssistantEl.dataset.rawText = currentText;
    if (currentTsEl && timestamp) currentTsEl.textContent = formatTime(timestamp);
    currentAssistantEl = null;
    currentContentEl = null;
    currentTsEl = null;
    cursorEl = null;
    currentText = '';
  }

  function highlightCodeBlocks(container) {
    if (typeof hljs === 'undefined') return; // static file failed to load — degrade gracefully
    container.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
  }

  function appendToolLine(name, inputSummary) {
    if (!currentAssistantEl) startAssistantMessage();
    clearThinking();
    appendToolLineToParent(currentAssistantEl, name, inputSummary);
  }

  function appendToolLineToParent(parent, name, inputSummary) {
    const icon = TOOL_ICONS[name] || '🔧';
    const verb = TOOL_VERBS[name] || name;
    const line = document.createElement('div');
    line.className = 'tool-line';
    line.innerHTML = `<span class="tool-icon">${icon}</span>${verb}${inputSummary ? ` <span class="tool-path">${escapeHtml(inputSummary)}</span>` : ''}`;
    parent.insertBefore(line, parent.querySelector('.content'));
  }

  // ── Input & sending ───────────────────────────────────────────────────────
  function send() {
    const text = inputEl.value.trim();
    if (!text || waiting || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'user_message', content: text }));
    inputEl.value = '';
    autoResize();
    hideAutocomplete();
    setWaiting(true);
  }

  function setWaiting(val) {
    waiting = val;
    sendBtn.disabled = val;
    sendBtn.textContent = val ? '…' : 'Send';
    clearBtn.disabled = val;
  }

  inputEl.addEventListener('keydown', (e) => {
    const items = autocomplete.querySelectorAll('.ac-item');
    if (autocomplete.style.display === 'block' && items.length > 0) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setAcIndex(acIndex + 1); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); setAcIndex(acIndex - 1); return; }
      if (e.key === 'Tab' || e.key === 'Enter') {
        if (acIndex >= 0) {
          e.preventDefault();
          applyAutocomplete(items[acIndex].dataset.command);
          return;
        }
      }
      if (e.key === 'Escape') { hideAutocomplete(); return; }
    }

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener('input', () => {
    autoResize();
    updateAutocomplete();
  });

  sendBtn.addEventListener('click', send);

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  // ── Slash command autocomplete ─────────────────────────────────────────────
  async function loadCommands() {
    try {
      const res = await fetch(COMMANDS_URL);
      const data = await res.json();
      commands = data.commands || [];
    } catch (e) {
      commands = [];
    }
  }

  function updateAutocomplete() {
    const val = inputEl.value;
    if (!val.startsWith('/') || val.includes(' ')) {
      hideAutocomplete();
      return;
    }
    const query = val.slice(1).toLowerCase();
    const matches = commands.filter(c => c.toLowerCase().startsWith(query));
    if (matches.length === 0) { hideAutocomplete(); return; }
    acIndex = 0; // auto-select the top match so Tab/Enter completes immediately
    showAutocomplete(matches);
  }

  function showAutocomplete(matches) {
    autocomplete.innerHTML = matches.map((c, i) =>
      `<div class="ac-item${i === acIndex ? ' selected' : ''}" data-command="${c}">
        <span class="ac-slash">/</span>${c}
      </div>`
    ).join('');
    autocomplete.style.display = 'block';
    autocomplete.querySelectorAll('.ac-item').forEach(el => {
      el.addEventListener('click', () => applyAutocomplete(el.dataset.command));
    });
  }

  function hideAutocomplete() {
    autocomplete.style.display = 'none';
    acIndex = -1;
  }

  function setAcIndex(i) {
    const items = autocomplete.querySelectorAll('.ac-item');
    acIndex = Math.max(-1, Math.min(i, items.length - 1));
    items.forEach((el, idx) => el.classList.toggle('selected', idx === acIndex));
  }

  function applyAutocomplete(command) {
    inputEl.value = '/' + command + ' ';
    hideAutocomplete();
    inputEl.focus();
  }

  // ── Copy & Clear ─────────────────────────────────────────────────────────
  messagesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const msgEl = btn.closest('.message.assistant');
    const text = msgEl ? (msgEl.dataset.rawText || '') : '';
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = original; }, 1500);
    });
  });

  clearBtn.addEventListener('click', () => {
    if (waiting || clearBtn.disabled) return;
    if (!confirm('Clear this conversation and start fresh? Claude will no longer remember anything said so far.')) return;
    ws.send(JSON.stringify({ type: 'clear_conversation' }));
  });

  // ── Utilities ─────────────────────────────────────────────────────────────
  function formatTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    setTimeout(() => { errorBanner.style.display = 'none'; }, 6000);
  }

  function _summarizeInput(name, input) {
    if (!input) return '';
    if (name === 'Read' || name === 'Write' || name === 'Edit' || name === 'MultiEdit')
      return input.file_path || '';
    if (name === 'Bash') {
      const cmd = input.command || '';
      return cmd.length > 80 ? cmd.slice(0, 80) + '…' : cmd;
    }
    if (name === 'Glob') return input.pattern || '';
    if (name === 'Grep') return input.pattern || '';
    if (name === 'WebFetch' || name === 'WebSearch') return input.url || input.query || '';
    return '';
  }

  // ── Init ─────────────────────────────────────────────────────────────────
  loadCommands();
  connect();
  inputEl.focus();

})();
</script>
</body>
</html>
